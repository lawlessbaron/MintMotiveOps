{% extends "base.html" %}
{% block title %}New Purchase Order — MintMotive Ops{% endblock %}
{% block content %}
<div class="page-header"><h1>New Purchase Order</h1></div>
<div class="card" style="max-width:560px;">
  <form method="post">
    <label>Supplier *</label><select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.supplier_name }}</option>{% endfor %}</select>
    <label>Expected Delivery Date</label><input type="date" name="expected_delivery_date">
    <label>Notes</label><textarea name="notes"></textarea>
    <button class="btn btn-accent" style="margin-top:12px;" type="submit">Create PO</button>
  </form>
</div>
{% endblock %}
