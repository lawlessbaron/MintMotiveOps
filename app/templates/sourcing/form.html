{% extends "base.html" %}
{% block title %}New Prospect — MintMotive Ops{% endblock %}
{% block content %}
<div class="page-header"><h1>New Sourcing Prospect</h1></div>
<div class="card" style="max-width:640px;">
  <form method="post" enctype="multipart/form-data">
    <label>Prospect Name *</label><input name="prospect_name" required>
    <label>Product Image</label><input type="file" name="product_image" accept="image/*">
    <label>Source Link</label><input name="source_link" placeholder="https://...">
    <div class="form-row">
      <div><label>Source Platform</label><select name="source_platform"><option>Alibaba</option><option>AliExpress</option><option>1688</option><option>Amazon</option><option>Direct Supplier Website</option><option>Other</option></select></div>
      <div><label>Supplier Name (as listed)</label><input name="supplier_name_listed"></div>
    </div>
    <div class="form-row">
      <div><label>Quoted Unit Price</label><input type="number" step="0.01" name="quoted_unit_price"></div>
      <div><label>Currency</label><select name="currency"><option>USD</option><option>AUD</option><option>EUR</option><option>Other</option></select></div>
    </div>
    <div class="form-row">
      <div><label>Minimum Order Qty</label><input type="number" name="minimum_order_quantity"></div>
      <div><label>Lead Time (days)</label><input type="number" name="lead_time_days"></div>
    </div>
    <label>Potential Category</label><select name="potential_category_id"><option value="">—</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
    <label>Notes</label><textarea name="notes"></textarea>
    <button class="btn btn-accent" style="margin-top:12px;" type="submit">Add Prospect</button>
  </form>
</div>
{% endblock %}
