{% extends "base.html" %}
{% block title %}New Asset — MintMotive Ops{% endblock %}
{% block content %}
<div class="page-header"><h1>New Asset</h1></div>
<div class="card">
  <form method="post">
    <div class="form-row">
      <div><label>Asset Name</label><input name="asset_name" required></div>
      <div><label>Asset Type</label><select name="asset_type_id"><option value="">—</option>{% for t in asset_types %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}</select></div>
      <div><label>Serial Number</label><input name="serial_number"></div>
    </div>
    <div class="form-row">
      <div><label>Purchase Date</label><input type="date" name="purchase_date"></div>
      <div><label>Purchase Cost</label><input type="number" step="0.01" name="purchase_cost"></div>
      <div><label>Location</label><select name="location_id"><option value="">—</option>{% for l in locations %}<option value="{{ l.id }}">{{ l.name }}</option>{% endfor %}</select></div>
      <div><label>Status</label><select name="status"><option>In Service</option><option>Under Maintenance</option><option>Retired</option></select></div>
    </div>
    <div class="form-row">
      <div><label>Power Plug Reference (optional)</label><input name="power_plug_reference" placeholder="e.g. 192.168.1.42 or shelly-printer-1"></div>
    </div>
    <p class="subtitle" style="margin-top:-6px;">If this asset is on a monitored smart plug, the Local Agent uses this (its LAN IP or hostname) to poll and report wattage — see Administration &gt; Local Agent.</p>
    <label>Maintenance Notes</label><textarea name="maintenance_notes"></textarea>
    <button class="btn btn-accent" style="margin-top:12px;" type="submit">Save Asset</button>
  </form>
</div>
{% endblock %}
