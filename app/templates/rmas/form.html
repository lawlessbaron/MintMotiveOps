{% extends "base.html" %}
{% block title %}New RMA — MintMotive Ops{% endblock %}
{% block content %}
<div class="page-header"><h1>New RMA</h1></div>
<div class="card" style="max-width:640px;">
  <form method="post">
    <label>Build (optional — a returned physical unit)</label>
    <select name="build_id">
      <option value="">—</option>
      {% for b in builds %}<option value="{{ b.id }}">{{ b.build_number }} · {{ b.kit_name }} ({{ b.serial_number or 'no serial' }})</option>{% endfor %}
    </select>
    <label>Client (optional if a Build is picked — defaults from it)</label>
    <select name="client_id">
      <option value="">—</option>
      {% for c in clients %}<option value="{{ c.id }}">{{ c.client_name }}</option>{% endfor %}
    </select>
    <label>Reason for Return</label>
    <textarea name="reason" placeholder="What's wrong with the unit?"></textarea>
    <button class="btn btn-accent" style="margin-top:12px;" type="submit">Log RMA</button>
  </form>
</div>
{% endblock %}
