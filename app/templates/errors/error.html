<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} — MintMotive Ops</title>
  <style>
    /* Deliberately self-contained — no app.css, no company theme tokens,
       no database lookups. An error page that depends on the same things
       that might be broken isn't a safety net. */
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1E2124; color: #F6EED9; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .box { max-width: 420px; padding: 40px; text-align: center; }
    .code { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: #9EC4B5; text-transform: uppercase; }
    h1 { font-size: 22px; margin: 10px 0 14px; }
    p { color: #C9C9C9; font-size: 14px; line-height: 1.5; }
    a { color: #9EC4B5; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">Error {{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p style="margin-top:24px;"><a href="/">← Back to Dashboard</a></p>
  </div>
</body>
</html>
